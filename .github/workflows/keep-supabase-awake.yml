# Free Supabase projects pause after a week without enough database activity, which takes the
# app's real people, check-ins and photos offline. This writes a heartbeat to the database
# four times a day so that doesn't happen (supabase/migrations/20261108150000_keep_alive.sql).
#
# If Supabase is paused anyway, the run fails and GitHub emails the repo owner. If the
# SUPABASE_ACCESS_TOKEN secret is set (a personal access token from
# https://supabase.com/dashboard/account/tokens), it also asks Supabase to restore the project.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: read
  actions: write # for the last step

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the database heartbeat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # The same public address and publishable key the website uses (web/config.js).
          URL=$(sed -n "s/.*SUPABASE_URL = '\(.*\)'.*/\1/p" web/config.js)
          KEY=$(sed -n "s/.*SUPABASE_KEY = '\(.*\)'.*/\1/p" web/config.js)
          REF=$(echo "$URL" | sed -n 's|https://\([a-z0-9]*\)\.supabase\.co|\1|p')
          status=$(curl -s -o response.txt -w "%{http_code}" --max-time 60 \
            -X POST "$URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered HTTP $status: $(cat response.txt)"
          if [ "$status" = "200" ]; then exit 0; fi

          echo "::error::Supabase didn't answer. It's probably paused: open https://supabase.com/dashboard/project/$REF and click Restore."
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            restore=$(curl -s -o restore.txt -w "%{http_code}" --max-time 60 -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$REF/restore")
            echo "Asked Supabase to restore the project: HTTP $restore $(cat restore.txt)"
          fi
          exit 1

      - name: Keep this schedule switched on
        # GitHub turns off scheduled workflows in public repos after 60 days without commits.
        # Re-enabling the workflow resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-supabase-awake.yml/enable"
